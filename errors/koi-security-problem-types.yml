  title: Invalid API key
  detail: |
    The supplied X-API-Key is not valid. Koi's first-party client also treats a response body equal to
    the literal string `Invalid API key` as this condition, regardless of status code.
  remediation: |
    Re-enter a valid organizational API key, or omit the header entirely to fall back to free,
    rate-limited anonymous access.
