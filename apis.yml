aid: koi-security
name: Koi Security
description: 'Koi (formerly Koi Security, now operating as koi.ai) is an endpoint security
  platform built for non-binary software — browser extensions, IDE and editor extensions,
  open-source packages, MCP servers, AI models, AI agents, and containers — the install
  surface that traditional EDR and MDM tooling was never designed to govern. The platform
  ships three products: Koi Endpoint (agentless discovery and governance of every binary
  and non-binary install across macOS, Windows, and Linux), Koi Wings (continuous risk
  evaluation of code, behavior, publisher ownership changes, and update channels), and
  Koi Gateway (a network-based gate in front of marketplaces, app stores, and registries).
  Koi is widely known for the security research it publishes on software supply-chain
  attacks including GlassWorm, Shai-Hulud, PhantomRaven, GreedyBear, and the first
  malicious MCP server found in the wild. Koi also operates ExtensionTotal, a free
  community risk-scoring service for Visual Studio Code extensions that exposes a public
  HTTP API and a first-party VS Code extension. Koi raised $48M and has been acquired by
  Palo Alto Networks.'
